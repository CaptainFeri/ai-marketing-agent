[project]
name = "ai-marketing-agent"
version = "0.1.0"
description = "Multi-tenant SEO/GEO and multimedia content generation platform running fully self-hosted models on a single GPU."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "bcrypt>=4.1",
    "pyjwt>=2.9",
    "cryptography>=43.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "boto3>=1.34",
    "pillow>=10.4",
    # Pinned exactly, not a floating range: scripts/download-chromium.ps1
    # installs this same version elsewhere to produce a byte-identical
    # browser revision to what the Dockerfile would otherwise fetch, so the
    # two must never drift apart.
    "playwright==1.63.0",
    "markdown>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.per-file-ignores]
# Autogenerated by Alembic; reformatting it would make review against the
# generator's output harder than the long lines are worth.
"migrations/versions/0001_initial_schema.py" = ["E501"]
# A trilingual label catalogue. Wrapping one-line {fa, en, ar} dicts across
# four lines each would treble the file and make the translations harder to
# compare, which is the thing most likely to go wrong in it.
"app/services/questionnaire.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
