# Single-server deployment (handoff section 4).
#
#   docker compose up -d postgres redis minio
#   docker compose run --rm api alembic upgrade head
#   docker compose up -d
#
# The gpu-worker is the only service allowed near the card, and it runs at
# concurrency 1 — see handoff section 6.

services:
  postgres:
    # pgvector is needed by migration 0003 (BGE-M3 embeddings).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app_system
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_system}
      POSTGRES_DB: ai_marketing
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init_roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_system -d ai_marketing"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      # See gpu-worker below re: SKIP_CHROMIUM_DOWNLOAD — every service
      # shares this Dockerfile, so a blocked cdn.playwright.dev fails any
      # of their builds unless they all pass the same arg.
      args:
        SKIP_CHROMIUM_DOWNLOAD: "${SKIP_CHROMIUM_DOWNLOAD:-false}"
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  # The single owner of the GPU. concurrency=1 is not a tuning knob: two
  # processes on one 24 GB card means an out-of-memory error, not throughput.
  # It's also the service that actually calls the Chromium overlay renderer
  # (execute_image_job, app/worker/tasks/gpu.py) — relevant if
  # SKIP_CHROMIUM_DOWNLOAD below is ever set (see docker-compose.override.yml.example).
  gpu-worker:
    build:
      context: .
      # cdn.playwright.dev 403s "not available in your location" from some
      # hosts (Dockerfile has the detail). Set SKIP_CHROMIUM_DOWNLOAD=true in
      # .env once you've run scripts/download-chromium.ps1 elsewhere and
      # copy docker-compose.override.yml.example to mount the result here —
      # a bind mount at /opt/pw-browsers would otherwise shadow the image's
      # own baked-in browser, so it isn't wired up by default.
      args:
        SKIP_CHROMIUM_DOWNLOAD: "${SKIP_CHROMIUM_DOWNLOAD:-false}"
    # check_models.py only reports what is already on disk under
    # MODELS_DIR — it never fetches anything itself. Fetching is a
    # separate, manual step (scripts/download-models.ps1, run elsewhere,
    # then copied onto this host) so a GPU box with no internet access can
    # still start every service that needs no model at all.
    command: >
      sh -c "python scripts/check_models.py && celery -A app.worker.celery_app worker
      --queues gpu --concurrency 1 --loglevel INFO --hostname gpu@%h"
    env_file: .env
    volumes:
      - ${MODELS_DIR:-./models}:/srv/app/models:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    # Uncomment once the NVIDIA container toolkit is installed on the host.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  cpu-worker:
    build:
      context: .
      # Same shared Dockerfile as api/gpu-worker — see gpu-worker above.
      args:
        SKIP_CHROMIUM_DOWNLOAD: "${SKIP_CHROMIUM_DOWNLOAD:-false}"
    command: >
      celery -A app.worker.celery_app worker
      --queues pipeline,publish,maintenance,media_cpu
      --concurrency 4 --loglevel INFO --hostname cpu@%h
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  beat:
    build:
      context: .
      # Same shared Dockerfile as api/gpu-worker — see gpu-worker above.
      args:
        SKIP_CHROMIUM_DOWNLOAD: "${SKIP_CHROMIUM_DOWNLOAD:-false}"
    command: celery -A app.worker.celery_app beat --loglevel INFO
    env_file: .env
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
