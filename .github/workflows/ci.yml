name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector, so migration 0003 runs for real in CI.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app_system
          POSTGRES_PASSWORD: app_system
          POSTGRES_DB: ai_marketing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_system"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: test
      TEST_DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/ai_marketing_test
      TEST_SYSTEM_DATABASE_URL: postgresql+psycopg://app_system:app_system@localhost:5432/ai_marketing_test
      GPU_RUNTIME: simulated
      GPU_SIMULATION_SPEEDUP: "100000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Create the non-BYPASSRLS application role
        # Row level security is only meaningful if the app role cannot bypass
        # it, so CI mirrors the production role split.
        run: |
          PGPASSWORD=app_system psql -h localhost -U app_system -d ai_marketing_test <<'SQL'
          CREATE ROLE app LOGIN PASSWORD 'app' NOBYPASSRLS;
          GRANT USAGE ON SCHEMA public TO app;
          ALTER DEFAULT PRIVILEGES FOR ROLE app_system IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO app;
          ALTER DEFAULT PRIVILEGES FOR ROLE app_system IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO app;
          SQL

      - name: Lint
        run: ruff check app tests migrations

      - name: Format check
        run: ruff format --check app tests migrations

      - name: Type check
        run: mypy app

      - name: Test
        run: pytest -q --cov=app --cov-report=term-missing

      - name: Check migrations match the models
        # An autogenerate that produces changes means a model was edited
        # without a migration.
        run: |
          alembic upgrade head
          alembic check
        env:
          SYSTEM_DATABASE_URL: postgresql+psycopg://app_system:app_system@localhost:5432/ai_marketing_test
